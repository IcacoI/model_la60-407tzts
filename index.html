<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Un pensiero speciale per te</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Special+Elite&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #1a1815;
            background-image: radial-gradient(#2d2923 1px, transparent 0);
            background-size: 24px 24px;
            font-family: 'Special Elite', 'Courier Prime', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #2b2621;
        }

        /* Schermata iniziale con l'icona al centro */
        #start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #121110;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.8s ease;
            text-align: center;
            padding: 20px;
        }

        .badge-60s {
            border: 2px dashed #d4af37;
            padding: 8px 16px;
            color: #d4af37;
            font-size: 0.85rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 35px;
            border-radius: 4px;
        }

        /* Icona Busta Vintage Cliccabile */
        .envelope-icon {
            font-size: 5rem;
            cursor: pointer;
            filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.3));
            animation: float 3s ease-in-out infinite;
            transition: transform 0.3s ease, filter 0.3s ease;
            user-select: none;
        }

        .envelope-icon:hover {
            transform: scale(1.15) rotate(3deg);
            filter: drop-shadow(0 0 25px rgba(212, 175, 55, 0.6));
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .subtitle-start {
            color: #a0988e;
            margin-top: 30px;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        /* Foglio di carta */
        .paper-container {
            width: 100%;
            max-width: 680px;
            background: #fbf8ef;
            background-image: linear-gradient(#e8e2d5 1px, transparent 1px);
            background-size: 100% 2.2rem;
            padding: 60px 50px 70px 50px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(0,0,0,0.05);
            border-radius: 2px;
            position: relative;
            min-height: 520px;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 1s ease, transform 1s ease;
        }

        .paper-container.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .stamp {
            position: absolute;
            top: 25px;
            right: 35px;
            border: 3px double #a83232;
            color: #a83232;
            padding: 6px 14px;
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            transform: rotate(-5deg);
            opacity: 0.85;
            user-select: none;
        }

        .typewriter-text {
            font-size: 1.15rem;
            line-height: 2.2rem;
            white-space: pre-wrap;
            word-wrap: break-word;
            color: #24201c;
        }

        .cursor {
            display: inline-block;
            width: 9px;
            height: 1.2rem;
            background-color: #24201c;
            margin-left: 2px;
            animation: blink 0.8s infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(26, 24, 21, 0.85);
            border: 1px solid #443e35;
            padding: 8px 15px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 50;
            backdrop-filter: blur(5px);
        }

        .controls button {
            background: none;
            border: none;
            color: #fbf8ef;
            font-family: 'Special Elite', monospace;
            font-size: 0.85rem;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            .paper-container { padding: 45px 25px 50px 25px; }
            .typewriter-text { font-size: 1rem; line-height: 2.2rem; }
            .envelope-icon { font-size: 4rem; }
        }
    </style>
</head>
<body>

    <!-- Schermata iniziale con icona centrale -->
    <div id="start-screen">
        <div class="badge-60s">✦ Riservato per te ✦</div>
        
        <!-- Icona cliccabile -->
        <div class="envelope-icon" onclick="startExperience()" title="Clicca per aprire">
            ✉️
        </div>
        
        <div class="subtitle-start">Clicca sulla busta per aprire la lettera</div>
    </div>

    <!-- Foglio di carta -->
    <div class="paper-container" id="paper">
        <div class="stamp">2° Mese • Distanza Annullata</div>
        <span class="typewriter-text" id="typewriter"></span><span class="cursor" id="cursor"></span>
    </div>

    <!-- Controlli Musica -->
    <div class="controls" id="audio-controls" style="display: none;">
        <button id="toggle-music" onclick="toggleMusic()">🎵 Musica: ON</button>
    </div>

    <script>
        const letterText = `miao`;

        const typingSpeed = 65;
        let index = 0;
        let musicPlaying = true;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playKeySound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(120 + Math.random() * 80, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.04);
        }

        function playBellSound() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1400, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.6);
        }

        const backgroundMusic = new Audio("https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3");
        backgroundMusic.loop = true;
        backgroundMusic.volume = 0.25;

        function startExperience() {
            document.getElementById('start-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('start-screen').style.display = 'none';
                document.getElementById('paper').classList.add('visible');
                document.getElementById('audio-controls').style.display = 'flex';
                
                backgroundMusic.play().catch(() => {});
                setTimeout(typeWriter, 400);
            }, 800);
        }

        function typeWriter() {
    if (index < letterText.length) {
        const char = letterText.charAt(index);
        document.getElementById("typewriter").textContent += char;

        if (char !== ' ' && char !== '\n') playKeySound();
        if (char === '\n') playBellSound();

        index++;
        setTimeout(typeWriter, typingSpeed + (Math.random() * 40 - 20));
    } else {
        // Scrittura completata: mostra il pulsante per il gioco
        setTimeout(() => {
            document.getElementById('cursor').style.display = 'none';
            
            // Crea pulsante per il gioco
            const btn = document.createElement('button');
            btn.innerHTML = '🎮 Entra nel Mini-Gioco Anni \'60';
            btn.style.cssText = 'display:block; margin:30px auto 0; background:#a83232; color:#fff; border:none; padding:12px 24px; font-family:"Special Elite",monospace; font-size:1rem; cursor:pointer; border-radius:4px; box-shadow:0 4px 10px rgba(0,0,0,0.3);';
            btn.onclick = () => window.location.href = 'gioco.html';
            document.getElementById('paper').appendChild(btn);
        }, 1500);
    }
}

        function toggleMusic() {
            const btn = document.getElementById('toggle-music');
            if (musicPlaying) {
                backgroundMusic.pause();
                btn.textContent = '🎵 Musica: OFF';
                musicPlaying = false;
            } else {
                backgroundMusic.play();
                btn.textContent = '🎵 Musica: ON';
                musicPlaying = true;
            }
        }
    </script>
</body>
</html>
