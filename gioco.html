<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Caccia ai Vinili '60s</title>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #121110;
            color: #fbf8ef;
            font-family: 'Special Elite', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            padding: 10px;
        }

        .header-title {
            margin-bottom: 8px;
            color: #d4af37;
            font-size: 1.2rem;
            letter-spacing: 1px;
            text-align: center;
        }

        #game-container {
            position: relative;
            border: 4px solid #d4af37;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            background: #2b2b2b;
            max-width: 100%;
        }

        canvas {
            background: #3e6b48; /* Erba parco vintage */
            display: block;
        }

        /* Modal Ricordo */
        #modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: #fbf8ef;
            color: #2b2621;
            padding: 22px;
            border-radius: 6px;
            border: 3px double #a83232;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
            text-align: center;
            width: 88%;
            max-width: 340px;
            display: none;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 20;
        }

        #modal.active {
            display: block;
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        #modal h3 { color: #a83232; margin-bottom: 8px; font-size: 1.1rem; }
        #modal p { font-size: 0.9rem; line-height: 1.4; margin-bottom: 15px; }
        
        .modal-btn {
            background: #a83232;
            color: #fff;
            border: none;
            padding: 8px 16px;
            font-family: 'Special Elite', monospace;
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.85rem;
        }

        /* Controlli Audio in alto a destra */
        .audio-toggle-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(26, 24, 21, 0.85);
            border: 1px solid #d4af37;
            color: #d4af37;
            padding: 4px 10px;
            border-radius: 12px;
            font-family: 'Special Elite', monospace;
            font-size: 0.75rem;
            cursor: pointer;
            z-index: 15;
        }

        /* Controlli Mobile Touch */
        .touch-controls {
            margin-top: 10px;
            display: grid;
            grid-template-columns: repeat(3, 52px);
            grid-template-rows: repeat(2, 52px);
            gap: 6px;
        }

        .touch-btn {
            background: #2d2923;
            border: 2px solid #d4af37;
            color: #d4af37;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            cursor: pointer;
        }
        .touch-btn:active { background: #d4af37; color: #1a1815; }
        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }

        @media (min-width: 768px) {
            .touch-controls { display: none; }
        }
    </style>
</head>
<body>

    <div class="header-title">✦ Trova i Vinili nel Parco ✦</div>

    <div id="game-container">
        <!-- Tasto Muto/Audio -->
        <button class="audio-toggle-btn" id="audio-btn" onclick="toggleAudio()">🎵 Audio: ON</button>

        <canvas id="gameCanvas" width="550" height="550"></canvas>
        
        <!-- Modal Popup Ricordo -->
        <div id="modal">
            <h3 id="modal-title">Vinile Trovato!</h3>
            <p id="modal-text">Un bellissimo ricordo...</p>
            <button class="modal-btn" onclick="closeModal()">Continua la passeggiata</button>
        </div>
    </div>

    <!-- Controlli Mobile -->
    <div class="touch-controls">
        <div class="touch-btn" id="btn-up">▲</div>
        <div class="touch-btn" id="btn-left">◄</div>
        <div class="touch-btn" id="btn-down">▼</div>
        <div class="touch-btn" id="btn-right">►</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Mappa ingrandita (550x550)
        const MAP_WIDTH = canvas.width;
        const MAP_HEIGHT = canvas.height;

        // Stato Giocatore (Ragazza retro con capelli rossastri e occhi verdi)
        const player = {
            x: 275,
            y: 480,
            radius: 14,
            speed: 3.2,
            facing: 'down'
        };

        // Canzone d'epoca morbida e tranquilla (Jazz/Bossa Lofi 60s)
        let vinylAudio = new Audio("canzone.mp3");
        vinylAudio.loop = true;
        vinylAudio.volume = 0.3;
        let isMuted = false;

        // I 3 Vinili/Ricordi nascosti sulla mappa
        const vinyls = [
            { id: 1, x: 100, y: 120, radius: 18, collected: false, title: "📻 1° Vinile: Il Primo Ciao", text: "Ricordi la nostra primissima chiamata? Ore e ore volate via senza nemmeno accorgercene..." },
            { id: 2, x: 440, y: 180, radius: 18, collected: false, title: "🎷 2° Vinile: Melodia Anni '60", text: "Questa atmosfera rilassante mi fa sempre pensare alla tua dolcezza e al tuo sorriso..." },
            { id: 3, x: 275, y: 80, radius: 18, collected: false, title: "❤️ 3° Vinile: 2 Mesi di Noi", text: "Anche se c'è la distanza a separarci, sei il mio pensiero fisso e la parte migliore di ogni giornata." }
        ];

        // Elementi decorativi stile Parco Anni '60
        const trees = [
            { x: 50, y: 50, r: 35 }, { x: 500, y: 60, r: 40 },
            { x: 480, y: 460, r: 35 }, { x: 70, y: 440, r: 38 },
            { x: 275, y: 280, r: 45 }
        ];

        const keys = {};

        // Controlli Tastiera
        window.addEventListener('keydown', e => { keys[e.key] = true; });
        window.addEventListener('keyup', e => { keys[e.key] = false; });

        // Controlli Touch
        const bindTouch = (id, key) => {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
        };
        bindTouch('btn-up', 'ArrowUp');
        bindTouch('btn-down', 'ArrowDown');
        bindTouch('btn-left', 'ArrowLeft');
        bindTouch('btn-right', 'ArrowRight');

        function toggleAudio() {
            const btn = document.getElementById('audio-btn');
            isMuted = !isMuted;
            if (isMuted) {
                vinylAudio.pause();
                btn.innerText = "🔇 Audio: OFF";
            } else {
                vinylAudio.play().catch(e => console.log("Audio non avviato:", e));
                btn.innerText = "🎵 Audio: ON";
            }
        }

        function update() {
            let dx = 0, dy = 0;
            if (keys['ArrowUp'] || keys['w']) { dy -= 1; player.facing = 'up'; }
            if (keys['ArrowDown'] || keys['s']) { dy += 1; player.facing = 'down'; }
            if (keys['ArrowLeft'] || keys['a']) { dx -= 1; player.facing = 'left'; }
            if (keys['ArrowRight'] || keys['d']) { dx += 1; player.facing = 'right'; }

            if (dx !== 0 && dy !== 0) {
                dx *= 0.7071;
                dy *= 0.7071;
            }

            player.x += dx * player.speed;
            player.y += dy * player.speed;

            player.x = Math.max(player.radius + 5, Math.min(MAP_WIDTH - player.radius - 5, player.x));
            player.y = Math.max(player.radius + 5, Math.min(MAP_HEIGHT - player.radius - 5, player.y));

            vinyls.forEach(v => {
                if (!v.collected) {
                    const dist = Math.hypot(player.x - v.x, player.y - v.y);
                    if (dist < player.radius + v.radius) {
                        v.collected = true;
                        showModal(v);
                    }
                }
            });
        }

        // Disegno Vinile Dettagliato
        function drawDetailedVinyl(x, y, radius) {
            ctx.save();
            ctx.translate(x, y);

            // Ombra sottostante
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.beginPath();
            ctx.arc(2, 4, radius, 0, Math.PI * 2);
            ctx.fill();

            // Disco Vinile Nero
            ctx.fillStyle = '#111111';
            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, Math.PI * 2);
            ctx.fill();

            // Solchi del vinile
            ctx.strokeStyle = '#2a2a2a';
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.arc(0, 0, radius * 0.8, 0, Math.PI * 2); ctx.stroke();
            ctx.beginPath(); ctx.arc(0, 0, radius * 0.65, 0, Math.PI * 2); ctx.stroke();
            ctx.beginPath(); ctx.arc(0, 0, radius * 0.5, 0, Math.PI * 2); ctx.stroke();

            // Etichetta Centrale Rosso Vintage
            ctx.fillStyle = '#c43c3c';
            ctx.beginPath();
            ctx.arc(0, 0, radius * 0.4, 0, Math.PI * 2);
            ctx.fill();

            // Foro centrale
            ctx.fillStyle = '#fbf8ef';
            ctx.beginPath();
            ctx.arc(0, 0, radius * 0.1, 0, Math.PI * 2);
            ctx.fill();

            // Riflesso di luce lucido (Stile 60s)
            ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.arc(0, 0, radius, -Math.PI / 4, -Math.PI / 12);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        // Disegno Ragazza Retro (Capelli Rossastri & Occhi Verdi)
        function drawPlayer(x, y) {
            ctx.save();
            ctx.translate(x, y);

            // Ombra ai piedi
            ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
            ctx.beginPath();
            ctx.ellipse(0, 12, 12, 6, 0, 0, Math.PI * 2);
            ctx.fill();

            // Chioma Capelli Rossastri (Volume)
            ctx.fillStyle = '#b84a29'; // Rosso rame/auburn
            ctx.beginPath();
            ctx.arc(0, -2, 16, 0, Math.PI * 2);
            ctx.fill();

            // Veste Anni '60
            ctx.fillStyle = '#e6b800';
            ctx.beginPath();
            ctx.arc(0, 4, 11, 0, Math.PI * 2);
            ctx.fill();

            // Visetto
            ctx.fillStyle = '#ffdfc4';
            ctx.beginPath();
            ctx.arc(0, -3, 9, 0, Math.PI * 2);
            ctx.fill();

            // Frangetta Capelli Rossastri
            ctx.fillStyle = '#b84a29';
            ctx.beginPath();
            ctx.arc(0, -7, 9, Math.PI * 0.9, Math.PI * 2.1);
            ctx.fill();

            // Occhi Verdi Retro
            ctx.fillStyle = '#2e8b57';
            ctx.beginPath(); ctx.arc(-3, -3, 2.2, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(3, -3, 2.2, 0, Math.PI * 2); ctx.fill();

            // Punti Luce Bianchi
            ctx.fillStyle = '#ffffff';
            ctx.beginPath(); ctx.arc(-3.5, -3.5, 0.8, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(2.5, -3.5, 0.8, 0, Math.PI * 2); ctx.fill();

            // Fiocchetto Anni '60
            ctx.fillStyle = '#a83232';
            ctx.beginPath(); ctx.arc(-6, -11, 3, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(-1, -12, 2, 0, Math.PI * 2); ctx.fill();

            ctx.restore();
        }

        function drawMapDecoration() {
            // Sentiero in ghiaia vintage
            ctx.fillStyle = '#5c4838';
            ctx.beginPath();
            ctx.arc(275, 275, 180, 0, Math.PI * 2);
            ctx.lineWidth = 20;
            ctx.strokeStyle = '#8c6d53';
            ctx.stroke();

            // Alberi
            trees.forEach(t => {
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.beginPath(); ctx.arc(t.x + 4, t.y + 6, t.r, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#274e31';
                ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#346640';
                ctx.beginPath(); ctx.arc(t.x - 3, t.y - 3, t.r * 0.75, 0, Math.PI * 2); ctx.fill();
            });
        }

        function render() {
            ctx.clearRect(0, 0, MAP_WIDTH, MAP_HEIGHT);

            drawMapDecoration();

            vinyls.forEach(v => {
                if (!v.collected) {
                    drawDetailedVinyl(v.x, v.y, v.radius);
                }
            });

            drawPlayer(player.x, player.y);
        }

        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        function showModal(vinyl) {
            document.getElementById('modal-title').innerText = vinyl.title;
            document.getElementById('modal-text').innerText = vinyl.text;
            document.getElementById('modal').classList.add('active');

            if (!isMuted) {
                vinylAudio.play().catch(e => console.log("Blocco audio sbloccato:", e));
            }
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        gameLoop();
    </script>
</body>
</html>
